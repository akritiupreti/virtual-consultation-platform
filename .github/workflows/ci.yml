name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma schema validation needs DATABASE_URL to resolve; the example
      # values are sufficient (no DB connection is made for generate/validate).
      - name: Materialize .env from example
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
