name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma schema validation needs DATABASE_URL to resolve; the example
      # values are sufficient (no DB connection is made for generate/validate).
      - name: Materialize .env from example
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage is OBSERVE-ONLY in Phase 5: the report is produced and uploaded,
      # but not gated. The ≥90% backend / ≥80% frontend gates are a Phase 6 concern
      # (NFR-7 / SC-10/11), so effort stays on the critical scenarios until then.
      - name: Test (unit) + coverage (observe-only)
        run: npm run test:cov --workspace backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  integration:
    name: integration · e2e (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vcp
          POSTGRES_PASSWORD: vcp_dev_password
          # The database name contains "test" — the e2e safety guard requires it.
          POSTGRES_DB: vcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcp -d vcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis so the socket.io Redis adapter path is exercised in CI (ADR-0004/0009).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vcp:vcp_dev_password@localhost:5432/vcp_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-secret
      JWT_EXPIRES_IN: 15m
      # Drive the claim-TTL sweeper deterministically from the tests; keep the
      # background tick out of the way so it never races the assertions.
      CLAIM_START_TTL_SECONDS: '120'
      CLAIM_TTL_SWEEP_INTERVAL_SECONDS: '3600'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy --schema backend/src/prisma/schema.prisma

      - name: Test (e2e)
        run: npm run test:e2e --workspace backend

  # Proves the full stack containerises and builds (SC-14 / ADR-0008). Images are
  # built but NOT pushed — the capstone deploys to local Docker Compose only, so
  # there is no registry and no deploy stage (and thus no registry secrets).
  docker:
    name: docker image build (no push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: vcp-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: vcp-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
