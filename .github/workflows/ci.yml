name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma schema validation needs DATABASE_URL to resolve; the example
      # values are sufficient (no DB connection is made for generate/validate).
      - name: Materialize .env from example
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Backend unit tests for fast signal (the gated coverage number is the
      # merged unit + e2e total, enforced in the `integration` job — ADR-0014).
      - name: Test backend (unit)
        run: npm run test --workspace backend

      # Frontend coverage is ENFORCED here (Phase 6): Vitest fails the job if the
      # component/unit suite drops below the ≥80% thresholds (NFR-7 / SC-11).
      - name: Test frontend (unit + component) — coverage GATE ≥80%
        run: npm run test:cov --workspace frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  integration:
    name: integration · e2e (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vcp
          POSTGRES_PASSWORD: vcp_dev_password
          # The database name contains "test" — the e2e safety guard requires it.
          POSTGRES_DB: vcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcp -d vcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vcp:vcp_dev_password@localhost:5432/vcp_test?schema=public
      JWT_SECRET: ci-only-test-secret
      JWT_EXPIRES_IN: 15m
      # Drive the claim-TTL sweeper deterministically from the tests; keep the
      # background tick out of the way so it never races the assertions.
      CLAIM_START_TTL_SECONDS: '120'
      CLAIM_TTL_SWEEP_INTERVAL_SECONDS: '3600'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy --schema backend/src/prisma/schema.prisma

      # Runs the unit + e2e suites with coverage, merges them, and ENFORCES the
      # gate: statements/lines/functions ≥90% (NFR-7 / SC-10), branches ≥65%.
      # The merged total is the honest coverage number because the core
      # guarantees are proven against a real Postgres, not mocks (ADR-0014).
      - name: Test (unit + e2e) — merged coverage GATE ≥90%
        run: npm run coverage:combined --workspace backend

      - name: Upload merged backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  # Proves the full stack containerises and builds (SC-14 / ADR-0006). Images are
  # built but NOT pushed — the capstone deploys to local Docker Compose only, so
  # there is no registry and no deploy stage (and thus no registry secrets).
  docker:
    name: docker image build (no push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: vcp-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: vcp-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Accessibility (WCAG 2.1 AA) + visual regression on the four critical screens
  # (C24 / C25 / SC-13 / ADR-0015 / ADR-0016). Runs INSIDE the pinned Playwright
  # container so the browser, fonts and anti-aliasing match the committed
  # snapshot baselines exactly — the cross-platform snapshot footgun. The app is
  # served as a static build with the backend stubbed, so no Postgres.
  accessibility-visual:
    name: a11y · visual regression (critical screens)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One Playwright run covers both suites (axe a11y + screenshot diff) and
      # builds/serves the app once via the config's webServer.
      - name: Accessibility + visual regression
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
