# Serve the built single-page app. Unknown paths fall back to index.html so
# client-side routing (react-router) works on deep links / refresh. The API and
# WebSocket are a separate origin (the backend's published port), reached directly
# by the browser via VITE_API_URL — nginx here serves static assets only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted assets Vite emits under /assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
